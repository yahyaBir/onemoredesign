<header
    class="site-header"
    id="siteHeader"
>

    <div class="navbar">


        <!-- LOGO -->

        <a
            href="{{home_href}}"
            class="navbar__logo"
            aria-label="One More Design ana sayfa"
        >
            <img
                src="./images/brand/onemore-white.svg"
                alt="One More Design" width="311" height="19">
        </a>


        <!-- DESKTOP MENU -->

        <nav
            class="navbar__nav"
            aria-label="Ana menü"
        >

            <a href="{{projects_href}}">
                Projeler
            </a>

            <a href="{{services_href}}">
                Hizmetler
            </a>

            <a href="{{about_href}}">
                Hakkımızda
            </a>

            <a href="{{news_href}}">
                Güncel
            </a>

            <a href="./iletisim.html">
                İletişim
            </a>

        </nav>


        <!-- DESKTOP RIGHT -->

        <div class="navbar__actions">

            <a
                href="./iletisim.html"
                class="navbar__cta"
            >
                Projenizi Konuşalım
            </a>


            <div class="navbar__social">

                <!-- Instagram -->

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm5.5-3a1 1 0 100 2 1 1 0 000-2z"/>
                    </svg>

                </a>


                <!-- LinkedIn -->

                <a
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="LinkedIn"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M6.5 8.5H3.5V21h3V8.5zM5 3A1.75 1.75 0 105 6.5 1.75 1.75 0 005 3zM20.5 13.5c0-3.6-1.9-5.3-4.5-5.3-2.1 0-3 1.1-3.5 1.9V8.5h-3V21h3v-6.2c0-1.6.3-3.2 2.4-3.2 2 0 2.1 1.9 2.1 3.3V21h3.5v-7.5z"/>
                    </svg>

                </a>

            </div>

        </div>


        <!-- MOBILE BUTTON -->

        <button
            class="navbar__toggle"
            id="menuToggle"
            type="button"
            aria-label="Menüyü aç"
            aria-expanded="false"
            aria-controls="mobileMenu"
        >

            <span></span>
            <span></span>

        </button>

    </div>


    <!-- MOBILE MENU -->

    <div
        class="mobile-menu"
        id="mobileMenu"
        aria-hidden="true"
    >

        <nav
            class="mobile-menu__nav"
            aria-label="Mobil menü"
        >

            <a href="{{projects_href}}">
                Projeler
            </a>

            <a href="{{services_href}}">
                Hizmetler
            </a>

            <a href="{{about_href}}">
                Hakkımızda
            </a>

            <a href="{{news_href}}">
                Güncel
            </a>

            <a href="./iletisim.html">
                İletişim
            </a>

        </nav>


        <div class="mobile-menu__bottom">

            <a
                href="./iletisim.html"
                class="mobile-menu__cta"
            >

                <span>
                    Projenizi Konuşalım
                </span>

                <span>
                    ↗
                </span>

            </a>


            <div class="mobile-menu__social">

                <a href="#">
                    Instagram
                </a>

                <a href="#">
                    LinkedIn
                </a>

            </div>

        </div>

    </div>

</header>
